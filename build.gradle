plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
}

group = 'com.wolverine'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

application {
    mainClass = 'wolverine.Program'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

pitest {
    junit5PluginVersion = '1.2.1'
    targetClasses = [project.findProperty('pitestTargetClasses') ?: 'wolverine.*']
    targetTests = [project.findProperty('pitestTargetTests') ?: 'wolverine.*']
    mutationThreshold = 80
}

task crap4j(type: Exec) {
    dependsOn test
    commandLine 'java', '-jar', 'lib/crap4java-0.1.0-SNAPSHOT.jar'
}

